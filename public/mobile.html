<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CamLens Mobile Streamer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #videoPreview {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Top Floating Status Bar */
    .mobile-header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .badge {
      pointer-events: auto;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      backdrop-filter: blur(10px);
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
    }

    .badge.live .badge-dot {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .badge.live {
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    /* Bottom Control Bar */
    .mobile-controls {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 10;
      padding: 0 20px;
    }

    .ctrl-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: all 0.2s;
    }

    .ctrl-btn:active {
      transform: scale(0.92);
      background: rgba(59, 130, 246, 0.5);
    }

    .ctrl-btn.active {
      background: #fbbc05;
      color: #000;
      border-color: #fbbc05;
      box-shadow: 0 0 20px rgba(251, 188, 5, 0.6);
    }

    .ctrl-btn svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    /* Quality Selector */
    .quality-select {
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(12px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
    }

    /* Permission / Start Modal */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 12, 16, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    .modal-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .modal-desc {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-start {
      background: linear-gradient(135deg, #4285f4 0%, #ea4335 100%);
      color: #fff;
      border: none;
      padding: 16px 36px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(66, 133, 244, 0.4);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Live Camera Video -->
  <video id="videoPreview" autoplay playsinline muted></video>

  <!-- Hidden Processing Canvas -->
  <canvas id="streamCanvas" style="display:none;"></canvas>

  <!-- Top Floating Header -->
  <div class="mobile-header">
    <div id="statusBadge" class="badge">
      <div class="badge-dot"></div>
      <span id="statusText">Connecting...</span>
    </div>

    <select id="qualitySelect" class="quality-select">
      <option value="1080">1080p (FHD)</option>
      <option value="720" selected>720p (HD)</option>
      <option value="480">480p (Fast)</option>
    </select>
  </div>

  <!-- Bottom Floating Camera Controls -->
  <div class="mobile-controls">
    <!-- Flip Camera -->
    <button id="btnFlip" class="ctrl-btn" title="Flip Camera">
      <svg viewBox="0 0 24 24">
        <path d="M9 3L5 6.99h3V14h2V6.99h3L9 3zm7 14.01V10h-2v7.01h-3L15 21l4-3.99h-3z"/>
      </svg>
    </button>

    <!-- Torch / Flashlight -->
    <button id="btnTorch" class="ctrl-btn" title="Toggle Flashlight">
      <svg viewBox="0 0 24 24">
        <path d="M7 2v11h3v9l7-12h-4l3-8z"/>
      </svg>
    </button>
  </div>

  <!-- Initial User Permission Screen -->
  <div id="permissionModal" class="modal-overlay">
    <div class="modal-title">CamLens Camera Streamer</div>
    <div class="modal-desc">
      Tap Start to allow camera access and stream live to your laptop with ultra-low latency.
    </div>
    <button id="btnStart" class="btn-start">Start Camera Stream</button>
  </div>

  <script src="mobile.js"></script>
</body>
</html>
